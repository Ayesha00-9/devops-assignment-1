services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      sonarqube:
        condition: service_healthy

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      - SONAR_EMBEDDED_DATABASE_TIMEOUT=120

volumes:
  jenkins_home:
  sonarqube_data: